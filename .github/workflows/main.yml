name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build archive (unsigned)
        run: |
          xcodebuild -project iTorrent.xcodeproj \
            -scheme iTorrent \
            -configuration Release \
            -archivePath build/iTorrent.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Create IPA
        run: |
          mkdir Payload
          cp -r build/iTorrent.xcarchive/Products/Applications/iTorrent.app Payload/
          zip -r iTorrent.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iTorrent-IPA
          path: iTorrent.ipa
