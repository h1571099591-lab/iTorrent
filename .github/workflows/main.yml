name: Build iOS IPA

on:
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build archive (unsigned)
        run: |
          xcodebuild -project iTorrent.xcodeproj \
            -scheme iTorrent \
            -configuration Release \
            -archivePath build/iTorrent.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir Payload
          cp -r build/iTorrent.xcarchive/Products/Applications/iTorrent.app Payload/
          zip -r iTorrent.ipa Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v3
        with:
          name: iTorrent-IPA
          path: iTorrent.ipa
