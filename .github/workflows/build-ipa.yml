name: Build and Export IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # LibTorrent.framework is produced by the LibTorrent.xcodeproj inside the
      # workspace; boost is required to configure the C++ build via make.sh.
      - name: Prepare dependencies
        run: |
          brew install boost
          ./Submodules/LibTorrent-Swift/make.sh

      # GoogleService-Info.plist is gitignored (real file lives only on the
      # developer's Mac). Use the secret when present, otherwise generate a
      # placeholder so the CI-only unsigned build has a valid build input.
      - name: Inject Firebase configuration
        env:
          FIREBASE_INFO_PLIST_BASE64: ${{ secrets.FIREBASE_INFO_PLIST_BASE64 }}
        run: |
          PLIST_PATH=iTorrent/Core/Assets/GoogleService-Info.plist
          if [ -n "$FIREBASE_INFO_PLIST_BASE64" ]; then
            echo -n "$FIREBASE_INFO_PLIST_BASE64" | base64 --decode -o "$PLIST_PATH"
          elif [ ! -f "$PLIST_PATH" ]; then
            echo "::warning::Secret FIREBASE_INFO_PLIST_BASE64 is not set; generating a placeholder GoogleService-Info.plist for this CI-only unsigned build."
            echo -n "" | base64 --decode -o "$PLIST_PATH"
          fi

      # Workspace build (not -project): LibTorrent.xcodeproj must be built.
      # -skipMacroValidation fixes "Macro 'PerceptionMacros' must be enabled".
      # SKIP_CRASHLYTICS_UPLOAD skips the Firebase dSYM upload script phase.
      - name: Build archive (unsigned)
        env:
          SKIP_CRASHLYTICS_UPLOAD: '1'
        run: |
          xcodebuild -workspace iTorrent.xcworkspace \
            -scheme iTorrent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/iTorrent.xcarchive \
            -skipMacroValidation \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Export IPA
        run: |
          APP_PATH=build/iTorrent.xcarchive/Products/Applications/iTorrent.app
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Archive did not produce $APP_PATH"
            exit 1
          fi
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r iTorrent.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: iTorrent-IPA
          path: iTorrent.ipa
          if-no-files-found: error
          retention-days: 7
